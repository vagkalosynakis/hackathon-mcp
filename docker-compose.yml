name: hackathon-mcp

services:
  php-mcp:
    image: webdevops/php-nginx:8.4
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/nginx/mcp.conf:/opt/docker/etc/nginx/vhost.common.d/20-mcp.conf:ro
    ports:
      - "8081:80"
    environment:
      FINTECH_API_BASE_URL: ${FINTECH_API_BASE_URL:-}
    networks:
      - default

networks:
  default:
    driver: bridge

